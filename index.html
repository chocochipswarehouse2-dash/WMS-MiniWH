<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistem Lembur & Cuti</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Halaman Login -->
  <div id="loginPage" class="auth-wrap">
    <div class="auth-card">
      <div class="brand-title">Sistem Lembur & Cuti</div>
      <h1>Login</h1>
      <form id="loginForm">
        <label>
          <span>Username / NIK</span>
          <input id="loginUsername" type="text" placeholder="Masukkan NIK atau admin" required />
        </label>
        <label>
          <span>Password</span>
          <input id="loginPassword" type="password" placeholder="Masukkan password" required />
        </label>
        <button type="submit" class="primary-btn">Masuk</button>
      </form>
      <div id="loginMessage" class="message-box"></div>
    </div>
  </div>

  <!-- Halaman Aplikasi -->
  <div id="appPage" class="hidden">
    <header class="topbar">
      <div class="topbar-left">
        <h2>Sistem Lembur & Cuti</h2>
      </div>
      <div class="topbar-actions">
        <span id="loggedUserLabel" class="user-badge">User</span>
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Dark/Light Mode">🌙</button>
        <button id="logoutBtn" class="secondary-btn small-btn">Logout</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="formLemburTab">Input Lembur</button>
      <button class="tab-btn" data-tab="statusLemburTab">Status Lembur</button>
      <button class="tab-btn" data-tab="formCutiTab">Input Ijin/Cuti</button>
      <button class="tab-btn" data-tab="statusCutiTab">Status Ijin/Cuti</button>
      <button id="adminLemburTabBtn" class="tab-btn hidden" data-tab="adminLemburTab">Admin Lembur</button>
      <button id="adminCutiTabBtn" class="tab-btn hidden" data-tab="adminCutiTab">Admin Ijin/Cuti</button>
      <button id="settingTabBtn" class="tab-btn hidden" data-tab="settingTab">Setting User</button>
    </nav>

    <main class="app-content">
      
      <!-- TAB: INPUT LEMBUR -->
      <section id="formLemburTab" class="tab-panel active">
        <div class="panel">
          <h3>Form Pengajuan Lembur</h3>
          <form id="lemburForm">
            <div class="user-info-box grid three-columns">
              <label><span>NIK</span><select id="l_nik" required></select></label>
              <label><span>Nama</span><input id="l_nama" readonly required/></label>
              <label><span>Divisi</span><input id="l_divisi" readonly required/></label>
            </div>
            
            <hr class="divider"/>
            <div id="lemburListContainer"></div>
            
            <div class="submit-row action-bar">
              <button type="button" id="addLemburRowBtn" class="secondary-btn">+ Tambah Baris Lembur</button>
              <button type="submit" class="primary-btn">Simpan Pengajuan</button>
            </div>
          </form>
        </div>
      </section>

      <!-- TAB: STATUS LEMBUR -->
      <section id="statusLemburTab" class="tab-panel">
        <div class="panel">
          <div class="panel-header-row">
            <h3>Rekap Lembur</h3>
            <button type="button" id="downloadStatusPdfBtn" class="primary-btn small-btn">Download PDF</button>
          </div>
          <div id="statusLemburTableWrap" class="table-wrap"></div>
        </div>
      </section>

      <!-- TAB: INPUT IJIN/CUTI -->
      <section id="formCutiTab" class="tab-panel">
        <div class="panel">
          <h3>Form Pengajuan Ijin / Cuti</h3>
          <form id="cutiForm">
            <div class="user-info-box grid three-columns">
              <label><span>NIK</span><select id="c_nik" required></select></label>
              <label><span>Nama</span><input id="c_nama" readonly required/></label>
              <label><span>Divisi</span><input id="c_divisi" readonly required/></label>
            </div>
            
            <hr class="divider"/>
            <div id="cutiListContainer"></div>
            
            <div class="submit-row action-bar">
              <button type="button" id="addCutiRowBtn" class="secondary-btn">+ Tambah Baris Ijin</button>
              <button type="submit" class="primary-btn">Simpan Pengajuan</button>
            </div>
          </form>
        </div>
      </section>

      <!-- TAB: STATUS IJIN/CUTI -->
      <section id="statusCutiTab" class="tab-panel">
        <div class="panel">
          <h3>Status Ijin / Cuti Saya</h3>
          <div id="statusCutiTableWrap" class="table-wrap"></div>
        </div>
      </section>

      <!-- TAB: ADMIN LEMBUR -->
      <section id="adminLemburTab" class="tab-panel hidden">
        <div class="panel">
          <div class="panel-header-row">
             <h3>Admin Rekap Semua Lembur</h3>
             <button type="button" id="downloadAdminPdfBtn" class="primary-btn small-btn">Download PDF</button>
          </div>
          <div id="adminLemburTableWrap" class="table-wrap"></div>
        </div>
      </section>

      <!-- TAB: ADMIN IJIN/CUTI -->
      <section id="adminCutiTab" class="tab-panel hidden">
        <div class="panel">
          <h3>Approval & Kelola Ijin / Cuti Karyawan</h3>
          <div id="adminCutiTableWrap" class="table-wrap"></div>
        </div>
      </section>

      <!-- TAB: SETTING -->
      <section id="settingTab" class="tab-panel hidden">
        <div class="panel">
          <h3>Kelola User</h3>
          <form id="userForm" class="user-form grid two-columns">
            <input type="hidden" id="userEditMode" value="false">
            <label><span>NIK</span><input id="userNIK" required/></label>
            <label><span>Nama</span><input id="userName" required/></label>
            <label><span>Divisi</span><input id="userDivisi" required/></label>
            <label><span>Username</span><input id="userUsername" required/></label>
            <label><span>Password</span><input id="userPassword" required/></label>
            <label><span>Role</span><select id="userRole"><option value="user">User</option><option value="admin">Admin</option></select></label>
            <div class="submit-row" style="grid-column: 1 / -1;">
              <button type="submit" class="primary-btn">Simpan User</button>
              <button type="button" id="resetUserFormBtn" class="secondary-btn">Reset</button>
            </div>
          </form>
          <hr class="divider"/>
          <h3>Daftar User Terdaftar</h3>
          <div id="userListWrap" class="table-wrap"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- MODAL EDIT LEMBUR -->
  <div id="editLemburModal" class="modal hidden">
    <div class="modal-content">
      <h3>Edit Data Lembur</h3>
      <form id="editLemburForm">
        <input type="hidden" id="editL_id">
        <label><span>Tanggal</span><input type="date" id="editL_tanggal" required></label>
        <label><span>Deskripsi Pekerjaan</span><input type="text" id="editL_deskripsi" required></label>
        <div class="grid two-columns">
          <label><span>Jam Mulai</span><input type="time" id="editL_jamMulai" required></label>
          <label><span>Jam Selesai</span><input type="time" id="editL_jamSelesai" required></label>
        </div>
        <label><span>Catatan</span><input type="text" id="editL_catatan"></label>
        <div class="submit-row" style="margin-top: 16px;">
          <button type="submit" class="primary-btn">Simpan Perubahan</button>
          <button type="button" class="secondary-btn" onclick="closeModal('editLemburModal')">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL EDIT CUTI -->
  <div id="editCutiModal" class="modal hidden">
    <div class="modal-content">
      <h3>Edit & Konfirmasi Ijin / Cuti</h3>
      <form id="editCutiForm">
        <input type="hidden" id="editC_id">
        <label><span>Jenis</span>
          <select id="editC_jenis" required>
            <option value="Cuti Tahunan">Cuti Tahunan</option>
            <option value="Sakit">Sakit</option>
            <option value="Ijin">Ijin Lainnya</option>
          </select>
        </label>
        <div class="grid two-columns">
          <label><span>Tanggal Mulai</span><input type="date" id="editC_tglMulai" required></label>
          <label><span>Tanggal Selesai</span><input type="date" id="editC_tglSelesai" required></label>
        </div>
        <label><span>Alasan</span><input type="text" id="editC_alasan" required></label>
        <label><span>Status Pengajuan</span>
          <select id="editC_status" required>
            <option value="Diajukan">Diajukan</option>
            <option value="Disetujui">Disetujui</option>
            <option value="Ditolak">Ditolak</option>
          </select>
        </label>
        <div class="submit-row" style="margin-top: 16px;">
          <button type="submit" class="primary-btn">Simpan Perubahan</button>
          <button type="button" class="secondary-btn" onclick="closeModal('editCutiModal')">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.0/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
